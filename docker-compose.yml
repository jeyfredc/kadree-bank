# Levanta base de datos, API y frontend:  docker compose up -d --build
# Variables en .env (copie .env.example).
name: kadree-bank

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kadreebank}
      POSTGRES_USER: ${POSTGRES_USER:-kadree}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en el archivo .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      # Los scripts se ejecutan en orden alfabético SOLO cuando el volumen está vacío.
      - ./db:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:-kadreebank};Username=${POSTGRES_USER:-kadree};Password=${POSTGRES_PASSWORD}"
      Bank__TimeZone: ${BANK_TIMEZONE:-America/Bogota}
      Swagger__Enabled: ${SWAGGER_ENABLED:-true}
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      Jwt__Key: ${JWT_KEY:?Defina JWT_KEY en el archivo .env}
      Auth__PinPepper: ${PIN_PEPPER:?Defina PIN_PEPPER en el archivo .env}
      Auth__DemoPin: ${DEMO_PIN:-}
      # Nginx reenvía la IP real del cliente (para el límite de intentos por IP).
      ReverseProxy__Enabled: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"
    restart: unless-stopped

  web:
    build: ./frontend
    environment:
      API_UPSTREAM: http://api:8080
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-4200}:80"
    restart: unless-stopped

volumes:
  db-data:
